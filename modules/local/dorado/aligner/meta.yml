# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: dorado_aligner
description: Align reads to a reference with dorado aligner and coordinate-sort the output with samtools
keywords:
  - nanopore
  - alignment
  - minimap2
  - bam
  - dorado
tools:
  - dorado:
      description: Oxford Nanopore Technologies basecaller and read aligner.
      homepage: https://github.com/nanoporetech/dorado
      documentation: https://dorado-docs.readthedocs.io/
      licence:
        - Oxford Nanopore Technologies PLC. Public License Version 1.0
      identifier: ''
  - samtools:
      description: Tools for manipulating next-generation sequencing data in SAM/BAM/CRAM format.
      homepage: http://www.htslib.org/
      documentation: http://www.htslib.org/doc/samtools.html
      doi: 10.1093/bioinformatics/btp352
      licence:
        - MIT
      identifier: biotools:samtools
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'sample1' ]
    - reads:
        type: file
        description: Reads to align (BAM, FASTQ or a directory of them)
        pattern: '*.{bam,fastq,fastq.gz,fq,fq.gz}'
        ontologies: []
  - fasta:
      type: file
      description: Reference FASTA file
      pattern: '*.{fa,fasta,fa.gz,fasta.gz}'
      ontologies:
        - edam: http://edamontology.org/format_1929
output:
  bam:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'sample1' ]
      - ${prefix}.bam:
          type: file
          description: Coordinate-sorted aligned BAM
          pattern: '*.bam'
          ontologies:
            - edam: http://edamontology.org/format_2572
  bai:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'sample1' ]
      - ${prefix}.bam.bai:
          type: file
          description: BAM index
          pattern: '*.bam.bai'
          ontologies:
            - edam: http://edamontology.org/format_3327
  versions_dorado:
    - - ${task.process}:
          type: string
          description: The name of the process
      - dorado:
          type: string
          description: The name of the tool
      - dorado --version 2>/dev/null | sed '1!d;s/[+].*//':
          type: eval
          description: The expression to obtain the version of the tool
  versions_samtools:
    - - ${task.process}:
          type: string
          description: The name of the process
      - samtools:
          type: string
          description: The name of the tool
      - samtools version | sed '1!d;s/.* //':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - dorado:
          type: string
          description: The name of the tool
      - dorado --version 2>/dev/null | sed '1!d;s/[+].*//':
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - samtools:
          type: string
          description: The name of the tool
      - samtools version | sed '1!d;s/.* //':
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - '@yuukiiwa'
maintainers:
  - '@yuukiiwa'
