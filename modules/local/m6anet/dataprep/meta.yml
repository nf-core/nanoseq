# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: m6anet_dataprep
description: Prepare nanopolish eventalign output for m6A detection with m6anet dataprep
keywords:
  - rna modification
  - nanopore
  - m6a
  - m6anet
tools:
  - m6anet:
      description: Detection of m6A RNA modifications from nanopore direct RNA sequencing data.
      homepage: https://github.com/GoekeLab/m6anet
      documentation: https://m6anet.readthedocs.io/
      doi: 10.1038/s41592-022-01666-1
      licence:
        - MIT
      identifier: biotools:m6anet
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'sample1' ]
    - genome:
        type: file
        description: Reference transcriptome FASTA file (unused by m6anet dataprep)
        pattern: '*.{fa,fasta}'
        ontologies:
          - edam: http://edamontology.org/format_1929
    - gtf:
        type: file
        description: Reference annotation GTF file (unused by m6anet dataprep)
        pattern: '*.gtf'
        ontologies:
          - edam: http://edamontology.org/format_2306
    - eventalign:
        type: file
        description: nanopolish eventalign output
        pattern: '*eventalign.txt'
        ontologies:
          - edam: http://edamontology.org/format_3475
    - nanopolish_summary:
        type: file
        description: nanopolish eventalign read summary (unused by m6anet dataprep)
        pattern: '*summary.txt'
        ontologies:
          - edam: http://edamontology.org/format_3475
output:
  dataprep_outputs:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'sample1' ]
      - ${prefix}:
          type: directory
          description: m6anet dataprep output directory (data.json, data.info, data.log)
          ontologies: []
  versions_m6anet:
    - - ${task.process}:
          type: string
          description: The name of the process
      - m6anet:
          type: string
          description: The name of the tool
      - m6anet --version 2>&1 | sed '1!d;s/.* //':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - m6anet:
          type: string
          description: The name of the tool
      - m6anet --version 2>&1 | sed '1!d;s/.* //':
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - '@yuukiiwa'
maintainers:
  - '@yuukiiwa'
