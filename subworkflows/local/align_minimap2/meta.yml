# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: align_minimap2
description: Index a reference, align long reads with minimap2 to a sorted, indexed BAM and collect SAMtools statistics
keywords:
  - alignment
  - long-read
  - nanopore
  - minimap2
  - bam
components:
  - minimap2/index
  - minimap2/align
  - bam_stats_samtools
input:
  - ch_fasta_fai:
      description: |
        Reference FASTA and its index
        Structure: [ val(meta), path(fasta), path(fai) ]
  - ch_fastq:
      description: |
        Reads to align
        Structure: [ val(meta), path(fastq) ]
output:
  - index:
      description: |
        minimap2 index
        Structure: [ val(meta), path(mmi) ]
  - bam:
      description: |
        Coordinate-sorted BAM
        Structure: [ val(meta), path(bam) ]
  - bai:
      description: |
        BAM index
        Structure: [ val(meta), path(bai) ]
  - stats:
      description: |
        SAMtools stats
        Structure: [ val(meta), path(stats) ]
  - flagstat:
      description: |
        SAMtools flagstat
        Structure: [ val(meta), path(flagstat) ]
  - idxstats:
      description: |
        SAMtools idxstats
        Structure: [ val(meta), path(idxstats) ]
authors:
  - '@yuukiiwa'
maintainers:
  - '@yuukiiwa'
